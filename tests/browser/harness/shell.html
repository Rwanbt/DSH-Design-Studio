<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Design Studio · browser harness</title>
<style>
  :root { color-scheme: dark }
  html, body { margin: 0; height: 100%; background: #1b1c1e; color: #e8e7e2;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif }
  #harness-bar { position: fixed; inset: 0 0 auto 0; height: 18px; z-index: 10;
    display: flex; align-items: center; gap: 8px; padding: 0 8px;
    font-size: 10px; letter-spacing: .04em; color: #7f838a; background: #17181a;
    border-bottom: 1px solid #26282b; pointer-events: none }
  #root { position: absolute; inset: 18px 0 0 0; display: flex; flex-direction: column }
</style>
</head>
<body>
<!--
  Deliberately minimal stand-in for the DeepSeek Harness client shell.
  It provides exactly the three integration points the plugin's client bundle is
  allowed to use: window.__ModuleLoader__, require('react') and ctx.slots. Every
  page, DOM node, pointer event, iframe, CSP and sandbox rule below this line is
  the real browser: only the DSH host shell is simulated. The Host HTTP API is
  NOT simulated: tests/browser/harness/host-server.mjs mounts the real
  src/plugin-host.mjs route handler over a real filesystem.
-->
<div id="harness-bar"><span>conversation.view</span><span id="harness-slot">pending</span>
  <span id="harness-sidebar-button" role="img" aria-label="Design Studio"><span id="harness-sidebar-icon"></span></span></div>
<div id="root"></div>
<script src="/react.js"></script>
<script src="/react-dom.js"></script>
<script>
  window.__DSH_HARNESS__ = { sessionId: '__SESSION__', injected: null, registration: null,
    registrations: { conversation: [], main: [], sidebar: [] }, injectedSlots: [], ready: false, errors: [], fatal: false }
  window.__ModuleLoader__ = { load(definition) { window.__pluginDefinition = definition } }
  window.addEventListener('error', (event) => {
    window.__DSH_HARNESS__.errors.push(String(event.message || 'error'))
  })
  window.addEventListener('unhandledrejection', (event) => {
    window.__DSH_HARNESS__.errors.push('unhandledrejection: ' + String(event.reason))
  })
</script>
<script src="/client.js"></script>
<script>
  (function boot() {
    const state = window.__DSH_HARNESS__
    const fail = (message) => { state.errors.push(message); state.fatal = true }
    const definition = window.__pluginDefinition
    if (!definition) return fail('client.js did not call window.__ModuleLoader__.load')
    if (typeof definition.factory !== 'function') return fail('plugin definition has no factory')
    const React = window.React
    const ReactDOM = window.ReactDOM
    if (!React || !ReactDOM) return fail('react/react-dom UMD bundles are missing')
    let module
    try {
      module = definition.factory((name) => {
        if (name === 'react') return React
        throw new Error('unexpected require: ' + name)
      })
    } catch (error) { return fail('factory threw: ' + String(error)) }
    if (!module || typeof module.apply !== 'function') return fail('plugin module exposes no apply()')
    // DSH renders one list id per sidebar cell and dispatches the main cell of
    // the same name; the stand-in keeps every registration so a spec can assert
    // what the real shell would have to work with.
    const registrations = { conversation: [], main: new Map(), sidebar: new Map() }
    const slots = {
      inject(name, callback) {
        state.injected = name
        state.injectedSlots = [...(state.injectedSlots || []), name]
        document.getElementById('harness-slot').textContent = 'inject ' + name
        callback()
      },
      register(details, view) {
        const name = details && details.name
        state.registration = { name, id: details && details.id, key: details && details.key,
          order: details && details.order,
          label: typeof details?.label === 'function' ? String(details.label()) : (details?.label ?? null) }
        if (name === 'conversation.view') {
          registrations.conversation.push({ details, view })
          state.conversationRegistration = state.registration
        }
        else if (name === 'main') registrations.main.set(details.key, { details, view })
        else if (name === 'sidebar.panellist') registrations.sidebar.set(details.id, { details, view })
        else state.errors.push('unexpected slot registration: ' + String(name))
        state.registrations = {
          conversation: registrations.conversation.map((entry) => entry.details.id),
          main: Array.from(registrations.main.keys()),
          sidebar: Array.from(registrations.sidebar.keys()),
        }
        return () => {}
      },
    }
    try { module.apply({ slots, get: key => key === 'sidebarRight' ? { openResource(address) { state.openedResource = address } } : undefined }) } catch (error) { return fail('apply threw: ' + String(error)) }
    if (registrations.conversation.length === 0) return fail('no conversation.view component registered')
    const icon = registrations.sidebar.get('design-studio')
    if (icon) {
      try {
        ReactDOM.createRoot(document.getElementById('harness-sidebar-icon')).render(
          React.createElement(icon.view, { size: 16, active: false }))
      } catch (error) { state.errors.push('sidebar icon render threw: ' + String(error)) }
    }
    const panelKey = new URLSearchParams(location.search).get('panel')
    const panel = panelKey ? registrations.main.get(panelKey) : null
    if (panelKey && !panel) return fail('no main panel registered for key ' + panelKey)
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(panel
        ? React.createElement(panel.view)
        : React.createElement(registrations.conversation[0].view, { sessionId: state.sessionId }))
    } catch (error) { return fail('render threw: ' + String(error)) }
    state.ready = true
  })()
</script>
</body>
</html>
